name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
        exclude:
          - os: macos-latest
            python: "3.10"
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Verify the bundled face model
        run: python tools/fetch_model.py --verify

      - name: End-to-end self-test (source)
        run: python -m headsize --self-test

      - name: Documentation builds and links resolve
        run: python tools/build_docs.py --check

  lint:
    name: Formatting and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff (lint + import order)
        run: ruff check --select E,F,I,W --line-length 96 headsize tests tools
        continue-on-error: true
      - name: Compile every module
        run: python -m compileall -q headsize tools

  package:
    name: Package the Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build and self-test the executable
        run: python tools/build_exe.py
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: headsize-studio-windows-x64
          path: |
            dist/HeadSize-Studio-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
