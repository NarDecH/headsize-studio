<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-label="Auto-update sequence">
  <style>
    .bg { fill: #131725; }
    .lane { fill: #1b2130; stroke: #2c3547; }
    .title { fill: #e9eefb; font: 600 15px "Segoe UI", system-ui, sans-serif; }
    .label { fill: #93a1bd; font: 12.5px "Segoe UI", system-ui, sans-serif; }
    .small { fill: #7d8aa5; font: 11.5px "Segoe UI", system-ui, sans-serif; }
    .msg { stroke: #4c5a78; stroke-width: 1.8; marker-end: url(#a3); }
    .msg-accent { stroke: #6c8cff; stroke-width: 2; marker-end: url(#a4); }
    .life { stroke: #33405a; stroke-width: 1.4; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4c5a78"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6c8cff"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="340" rx="16"/>
  <text class="title" x="28" y="40">Auto-update: check → verify → swap → relaunch</text>

  <g>
    <rect class="lane" x="28" y="60" width="150" height="36" rx="9"/>
    <text class="label" x="48" y="84">HeadSize Studio</text>
    <rect class="lane" x="392" y="60" width="176" height="36" rx="9"/>
    <text class="label" x="412" y="84">GitHub Releases</text>
    <rect class="lane" x="748" y="60" width="204" height="36" rx="9"/>
    <text class="label" x="768" y="84">update helper (cmd/sh)</text>
  </g>

  <line class="life" x1="103" y1="96" x2="103" y2="300"/>
  <line class="life" x1="480" y1="96" x2="480" y2="300"/>
  <line class="life" x1="850" y1="96" x2="850" y2="300"/>

  <path class="msg" d="M103 118 H 476"/>
  <text class="small" x="120" y="112">GET /repos/{owner}/{repo}/releases</text>

  <path class="msg" d="M476 148 H 107"/>
  <text class="small" x="120" y="142">tag_name, notes, assets[]</text>

  <path class="msg-accent" d="M103 178 H 476"/>
  <text class="small" x="120" y="172">download build + SHA256SUMS.txt</text>

  <path class="msg" d="M476 208 H 107"/>
  <text class="small" x="120" y="202">922 kio … sha256 must match</text>

  <path class="msg-accent" d="M103 238 H 846"/>
  <text class="small" x="120" y="232">spawn detached: wait for PID → rename .old → move → start</text>

  <path class="msg" d="M846 268 H 107"/>
  <text class="small" x="120" y="262">new version running, backup deleted</text>

  <text class="label" x="28" y="322">Runs on start-up (optional) or from the sidebar; portable builds only, and never without a checksum when one is published.</text>
</svg>
