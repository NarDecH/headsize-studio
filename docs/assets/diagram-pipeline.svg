<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="HeadSize Studio pipeline">
  <style>
    .bg { fill: #131725; }
    .box { fill: #1c2333; stroke: #33405a; stroke-width: 1.5; }
    .box-accent { fill: #22283f; stroke: #6c8cff; stroke-width: 1.6; }
    .title { fill: #e9eefb; font: 600 15px "Segoe UI", system-ui, sans-serif; }
    .sub { fill: #93a1bd; font: 12.5px "Segoe UI", system-ui, sans-serif; }
    .step { fill: #6c8cff; font: 600 12px "Segoe UI", system-ui, sans-serif; }
    .arrow { stroke: #4c5a78; stroke-width: 2; fill: none; marker-end: url(#head); }
    .chip { fill: #1b2130; stroke: #2c3547; }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4c5a78"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="300" rx="16"/>

  <g>
    <rect class="box" x="24" y="96" width="150" height="96" rx="12"/>
    <text class="step" x="42" y="122">1 · INPUT</text>
    <text class="title" x="42" y="148">Photo</text>
    <text class="sub" x="42" y="170">PNG / JPEG / WebP</text>
  </g>

  <path class="arrow" d="M174 144 H 216"/>

  <g>
    <rect class="box-accent" x="216" y="96" width="168" height="96" rx="12"/>
    <text class="step" x="234" y="122">2 · DETECT</text>
    <text class="title" x="234" y="148">YuNet DNN</text>
    <text class="sub" x="234" y="170">face box + 5 landmarks</text>
  </g>

  <path class="arrow" d="M384 144 H 426"/>

  <g>
    <rect class="box" x="426" y="96" width="176" height="96" rx="12"/>
    <text class="step" x="444" y="122">3 · GEOMETRY</text>
    <text class="title" x="444" y="148">Head ellipse</text>
    <text class="sub" x="444" y="170">eyes on the midline</text>
  </g>

  <path class="arrow" d="M602 144 H 644"/>

  <g>
    <rect class="box-accent" x="644" y="96" width="168" height="96" rx="12"/>
    <text class="step" x="662" y="122">4 · WARP</text>
    <text class="title" x="662" y="148">Inverse map</text>
    <text class="sub" x="662" y="170">cv2.remap · ROI only</text>
  </g>

  <path class="arrow" d="M812 144 H 852"/>

  <g>
    <rect class="box" x="852" y="96" width="104" height="96" rx="12"/>
    <text class="step" x="868" y="122">5 · OUTPUT</text>
    <text class="title" x="868" y="148">Save</text>
    <text class="sub" x="868" y="170">EXIF kept</text>
  </g>

  <g>
    <rect class="chip" x="216" y="228" width="392" height="40" rx="10"/>
    <text class="sub" x="234" y="253">The editable state is parametric: only the ellipse and the factor, never pixels.</text>
  </g>
  <g>
    <rect class="chip" x="628" y="228" width="328" height="40" rx="10"/>
    <text class="sub" x="646" y="253">Undo/redo replays from the original photo, so it never degrades.</text>
  </g>

  <text class="sub" x="24" y="52">HeadSize Studio processes one photo in five steps.</text>
  <text class="title" x="24" y="76" style="font-size:17px">From a photo to a resized head</text>
  <path class="arrow" d="M24 200 H 24" />
</svg>
